<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐶 找小狗</title>
    <style>
        /* ... 前面的样式保持不变 ... */
        /* 新增：长按进度环 */
        .cell.long-press {
            background: #a0a0a0 !important;
            transform: scale(0.95);
            transition: all 0.1s;
        }
        .cell .press-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid #ff6600;
            width: 60%;
            height: 60%;
            animation: ringFill 0.4s linear forwards;
        }
        @keyframes ringFill {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        /* 操作提示 */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
        #toast.show {
            opacity: 1;
        }
        /* 右下角操作提示 */
        #hint {
            text-align: center;
            color: #666;
            font-size: 12px;
            padding: 6px;
            margin-top: 4px;
            background: #d1d1d1;
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
        }
        #hint span {
            display: inline-block;
            margin: 0 10px;
        }
        .icon-small {
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="game">
    <!-- 顶栏 -->
    <div id="top-bar">
        <div class="counter" id="counter">010</div>
        <button id="reset-btn">🐾</button>
        <div class="timer" id="timer">000</div>
    </div>

    <!-- 难度菜单 -->
    <div id="menu">
        <button data-level="easy">🐶 初级</button>
        <button data-level="medium">🐶 中级</button>
        <button data-level="hard">🐶 高级</button>
    </div>

    <!-- 网格 -->
    <div id="grid"></div>

    <!-- 底部操作提示 -->
    <div id="hint">
        <span>👆 点击翻开</span>
        <span>👆 长按插旗 🚩</span>
        <span>🔢 点击数字快速展开</span>
    </div>
</div>

<!-- Toast提示 -->
<div id="toast"></div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">😊</h2>
        <p id="modal-msg">消息</p>
        <button id="modal-btn">再来一局</button>
    </div>
</div>

<script>
// ============================================================
//  完整JS代码（优化长按交互）
// ============================================================

// ----- 配置 -----
const LEVELS = {
    easy:   { rows: 9, cols: 9, dogs: 10 },
    medium: { rows: 16, cols: 16, dogs: 40 },
    hard:   { rows: 16, cols: 30, dogs: 99 }
};

let config = { rows: 9, cols: 9, dogs: 10 };

// ----- 状态 -----
let grid = [];
let dogPositions = new Set();
let revealedCount = 0;
let flagCount = 0;
let gameOver = false;
let firstClick = true;
let timerRunning = false;
let seconds = 0;
let timerInterval = null;

const gridEl = document.getElementById('grid');
const counterEl = document.getElementById('counter');
const timerEl = document.getElementById('timer');
const resetBtn = document.getElementById('reset-btn');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalMsg = document.getElementById('modal-msg');
const modalBtn = document.getElementById('modal-btn');
const toast = document.getElementById('toast');

// 防止长按菜单
document.addEventListener('contextmenu', e => e.preventDefault());

// ----- Toast提示 -----
let toastTimer = null;
function showToast(msg, duration = 1000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove('show');
    }, duration);
}

// ----- 初始化 -----
function initGame(level = 'easy') {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    timerRunning = false;
    seconds = 0;
    timerEl.textContent = '000';

    config = LEVELS[level];
    const { rows, cols, dogs } = config;

    grid = [];
    dogPositions = new Set();
    revealedCount = 0;
    flagCount = 0;
    gameOver = false;
    firstClick = true;
    resetBtn.textContent = '🐾';

    for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
            grid[r][c] = {
                revealed: false,
                flagged: false,
                dog: false,
                adjCount: 0
            };
        }
    }

    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.innerHTML = '';
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.r = r;
            cell.dataset.c = c;
            
            // ----- 优化的长按插旗逻辑 -----
            let longPressTimer = null;
            let isLongPress = false;
            let pressStartTime = 0;
            
            // 触摸开始
            cell.addEventListener('touchstart', (e) => {
                if (gameOver) return;
                const touch = e.touches[0];
                pressStartTime = Date.now();
                isLongPress = false;
                
                // 清除之前的定时器
                clearTimeout(longPressTimer);
                
                // 设置长按定时器（400ms触发插旗）
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    // 触发震动（如果支持）
                    if (navigator.vibrate) {
                        navigator.vibrate(20);
                    }
                    handleRightClick(r, c);
                    showToast('🚩 已插旗 / 取消插旗', 600);
                }, 400);
                
                // 添加按压视觉效果
                cell.classList.add('long-press');
            }, { passive: true });
            
            // 触摸移动（取消长按）
            cell.addEventListener('touchmove', (e) => {
                clearTimeout(longPressTimer);
                cell.classList.remove('long-press');
            }, { passive: true });
            
            // 触摸结束
            cell.addEventListener('touchend', (e) => {
                clearTimeout(longPressTimer);
                cell.classList.remove('long-press');
                
                // 如果是短按（非长按），执行左键点击
                if (!isLongPress && !gameOver) {
                    // 防止和长按冲突
                    const elapsed = Date.now() - pressStartTime;
                    if (elapsed < 400) {
                        handleLeftClick(r, c);
                    }
                }
                isLongPress = false;
            }, { passive: true });
            
            // 触摸取消（如滑出格子）
            cell.addEventListener('touchcancel', () => {
                clearTimeout(longPressTimer);
                cell.classList.remove('long-press');
                isLongPress = false;
            }, { passive: true });
            
            // 鼠标事件（PC调试用）
            cell.addEventListener('click', () => {
                if (!gameOver) handleLeftClick(r, c);
            });
            cell.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (!gameOver) {
                    handleRightClick(r, c);
                    showToast('🚩 已插旗 / 取消插旗', 600);
                }
            });
            
            gridEl.appendChild(cell);
        }
    }

    updateCounter();
    updateAllCells();
}

// ----- 放置小狗 -----
function placeDogs(safeRow, safeCol) {
    const { rows, cols, dogs } = config;
    const safeZone = new Set();
    for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
            const nr = safeRow + dr, nc = safeCol + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                safeZone.add(nr + ',' + nc);
            }
        }
    }
    const candidates = [];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (!safeZone.has(r + ',' + c)) {
                candidates.push([r, c]);
            }
        }
    }
    if (candidates.length < dogs) {
        candidates.length = 0;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (r !== safeRow || c !== safeCol) {
                    candidates.push([r, c]);
                }
            }
        }
    }
    const shuffled = candidates.sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, dogs);
    for (const [r, c] of selected) {
        grid[r][c].dog = true;
        dogPositions.add(r + ',' + c);
    }
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (grid[r][c].dog) continue;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].dog) {
                        count++;
                    }
                }
            }
            grid[r][c].adjCount = count;
        }
    }
}

// ----- 核心操作 -----
function handleLeftClick(row, col) {
    if (gameOver) return;
    const cell = grid[row][col];
    if (cell.flagged) {
        showToast('🚩 已插旗，长按取消', 600);
        return;
    }
    if (cell.revealed) {
        if (cell.adjCount > 0) {
            chordReveal(row, col);
        }
        return;
    }

    if (firstClick) {
        placeDogs(row, col);
        firstClick = false;
        startTimer();
    }

    if (cell.dog) {
        gameOverHandler(row, col);
        return;
    }

    revealCell(row, col);
}

function handleRightClick(row, col) {
    if (gameOver) return;
    const cell = grid[row][col];
    if (cell.revealed) return;

    cell.flagged = !cell.flagged;
    flagCount += cell.flagged ? 1 : -1;
    updateCounter();
    updateAllCells();
}

function revealCell(row, col) {
    const { rows, cols } = config;
    const cell = grid[row][col];
    if (cell.revealed || cell.flagged || cell.dog) return;

    cell.revealed = true;
    revealedCount++;

    const el = getCellElement(row, col);
    el.classList.add('revealed');

    if (cell.adjCount > 0) {
        el.textContent = cell.adjCount;
        el.classList.add('n' + cell.adjCount);
    } else {
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = row + dr, nc = col + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                    const neighbor = grid[nr][nc];
                    if (!neighbor.revealed && !neighbor.flagged) {
                        revealCell(nr, nc);
                    }
                }
            }
        }
    }

    checkWin();
}

function chordReveal(row, col) {
    const { rows, cols } = config;
    const cell = grid[row][col];
    if (!cell.revealed || cell.adjCount === 0) return;

    let flagCountAround = 0;
    for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = row + dr, nc = col + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                if (grid[nr][nc].flagged) flagCountAround++;
            }
        }
    }

    if (flagCountAround === cell.adjCount) {
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = row + dr, nc = col + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                    const neighbor = grid[nr][nc];
                    if (!neighbor.revealed && !neighbor.flagged) {
                        if (neighbor.dog) {
                            gameOverHandler(nr, nc);
                            return;
                        }
                        revealCell(nr, nc);
                    }
                }
            }
        }
    }
}

// ----- 游戏结束 -----
function gameOverHandler(row, col) {
    if (gameOver) return;
    gameOver = true;
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    const el = getCellElement(row, col);
    el.textContent = '😊';
    el.classList.add('revealed', 'mine-exploded');
    resetBtn.textContent = '😵';

    for (const key of dogPositions) {
        const [r, c] = key.split(',').map(Number);
        const cell = grid[r][c];
        if (!cell.revealed) {
            const e = getCellElement(r, c);
            e.textContent = '🐶';
            e.classList.add('revealed');
            cell.revealed = true;
        }
    }

    for (let r = 0; r < config.rows; r++) {
        for (let c = 0; c < config.cols; c++) {
            const cell = grid[r][c];
            if (cell.flagged && !cell.dog) {
                const e = getCellElement(r, c);
                e.textContent = '❌';
                e.classList.add('revealed');
            }
        }
    }

    showModal('💀', '哎呀！踩到小狗了！🐶', '🐾 再来一局');
}

// ----- 胜利 -----
function checkWin() {
    const total = config.rows * config.cols;
    if (revealedCount === total - config.dogs) {
        gameOver = true;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        resetBtn.textContent = '😎';

        for (const key of dogPositions) {
            const [r, c] = key.split(',').map(Number);
            const e = getCellElement(r, c);
            e.textContent = '🐶';
            e.classList.add('revealed');
            e.style.background = '#ffff99';
        }

        showModal('🎉', '你找到了所有小狗！🐶🐶🐶', '🐾 再来一局');
    }
}

// ----- UI辅助 -----
function getCellElement(row, col) {
    return gridEl.querySelector(`[data-r="${row}"][data-c="${col}"]`);
}

function updateAllCells() {
    const { rows, cols } = config;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const cell = grid[r][c];
            const el = getCellElement(r, c);
            if (cell.revealed) {
                if (!el.classList.contains('revealed')) {
                    el.classList.add('revealed');
                    if (cell.adjCount > 0) {
                        el.textContent = cell.adjCount;
                        el.classList.add('n' + cell.adjCount);
                    }
                }
            } else if (cell.flagged) {
                el.textContent = '🚩';
                el.classList.add('flagged');
            } else {
                el.textContent = '';
                el.classList.remove('flagged', 'revealed');
                el.className = 'cell';
            }
        }
    }
}

function updateCounter() {
    const remaining = config.dogs - flagCount;
    counterEl.textContent = String(remaining).padStart(3, '0');
}

// ----- 计时器 -----
function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = String(seconds).padStart(3, '0');
        if (seconds >= 999) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }, 1000);
}

// ----- 弹窗 -----
function showModal(title, msg, btnText) {
    modalTitle.textContent = title;
    modalMsg.textContent = msg;
    modalBtn.textContent = btnText;
    modal.classList.add('active');
}

modalBtn.addEventListener('click', () => {
    modal.classList.remove('active');
    initGame(getCurrentLevel());
});

modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        modal.classList.remove('active');
        initGame(getCurrentLevel());
    }
});

// ----- 难度切换 -----
function getCurrentLevel() {
    const active = document.querySelector('#menu button.active');
    return active ? active.dataset.level : 'easy';
}

document.querySelectorAll('#menu button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initGame(btn.dataset.level);
    });
});

// ----- 重置 -----
resetBtn.addEventListener('click', () => {
    if (modal.classList.contains('active')) {
        modal.classList.remove('active');
    }
    initGame(getCurrentLevel());
});

// ----- 启动 -----
document.querySelector('#menu button[data-level="easy"]').classList.add('active');
initGame('easy');
</script>
</body>
</html>
